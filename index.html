<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>던전 대장간</title>
<style>
:root{
  --bg:#0b1018;--panel:#141922;--panel2:#1a1f2a;--line:#7a5b32;--gold:#f3c57a;--gold2:#d8942a;--paper:#dec39b;
  --red:#d73723;--blue:#226dd6;--green:#4abd69;--text:#f6ead4;--muted:#cbb28d;--shadow:0 10px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:var(--text);background:#05080c;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.7)),url('assets/art/dungeon.webp') center/cover no-repeat;filter:saturate(1.03);z-index:-2}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,145,0,.15),transparent 22%),radial-gradient(circle at 80% 15%,rgba(45,140,255,.16),transparent 20%);z-index:-1}
#app{max-width:460px;min-height:100dvh;margin:0 auto;padding:14px 12px 98px;position:relative}
.topbrand{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}
.brandtitle{font-size:36px;line-height:.9;font-weight:900;letter-spacing:-2px;text-shadow:0 3px 0 #1e0e00,0 0 12px rgba(255,150,0,.34)}
.brandtitle span{display:block;background:linear-gradient(#fff0c7,#e8ad4f 55%,#b46a22);-webkit-background-clip:text;background-clip:text;color:transparent}
.brandsub{font-size:11px;color:#f1d29e;background:rgba(16,12,10,.72);border:1px solid #8d632f;padding:4px 8px;border-radius:999px}
.screen{position:relative;border-radius:28px;padding:10px 10px 14px;background:linear-gradient(180deg,rgba(27,20,16,.92),rgba(10,12,16,.95));border:2px solid #b07f3b;box-shadow:0 0 0 2px rgba(255,215,142,.09) inset,var(--shadow);overflow:hidden}
.screen::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 18%,transparent 82%,rgba(0,0,0,.15));pointer-events:none}
.screenheader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.headerleft{display:flex;align-items:center;gap:8px}
.emblem{width:30px;height:30px;border-radius:999px;border:1px solid #af834b;background:radial-gradient(circle at 30% 30%,#7e5c2d,#24180d 70%);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.screentitle{font-size:20px;font-weight:900;letter-spacing:-1px;text-shadow:0 2px 3px rgba(0,0,0,.45)}
.resources{display:flex;gap:6px}
.reschip{min-width:74px;background:linear-gradient(180deg,#2c2f36,#14181f);border:1px solid #7a603c;border-radius:12px;padding:6px 8px;display:flex;align-items:center;gap:6px;justify-content:center;font-size:13px;font-weight:800;color:#fff2d4}
.reschip.plus{min-width:32px;padding:6px 0}
.reschip small{font-size:12px;opacity:.95}
.panel{background:linear-gradient(180deg,rgba(19,20,26,.94),rgba(10,10,14,.96));border:1px solid rgba(191,145,78,.72);border-radius:18px;box-shadow:inset 0 1px rgba(255,222,174,.08),0 10px 24px rgba(0,0,0,.22)}
.stagebar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;margin-bottom:8px}
.stagebar .name{font-weight:900;color:#fff1c8}
.stagebar .name small{display:block;color:#d2b380;font-size:12px;margin-top:1px}
.stagepath{display:flex;align-items:center;gap:6px;color:#e8c17a;font-size:12px}
.stagepath .dot{width:9px;height:9px;border-radius:50%;background:#866839;border:1px solid #f5cc77;box-shadow:0 0 8px rgba(248,168,40,.32)}
.stagepath .boss{background:#8d1b1b;border-color:#ffb1b1}
.battlefield{position:relative;min-height:340px;border-radius:20px;overflow:hidden;border:1px solid rgba(205,156,78,.8);background:linear-gradient(180deg,rgba(7,20,38,.2),rgba(0,0,0,.2)),url('assets/art/dungeon.webp') center/cover no-repeat}
.battlefield .righticons{position:absolute;right:10px;top:74px;display:flex;flex-direction:column;gap:8px;z-index:2}
.sideicon{width:64px;height:64px;border-radius:16px;background:rgba(8,12,18,.8);border:1px solid rgba(223,181,100,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#f4dfb3;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.battleactors{position:relative;min-height:248px;padding:54px 14px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.actor{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-width:0}
.actor img{max-width:100%;height:180px;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.actor.hero img{height:188px}
.actor.enemy img{height:152px}
.actorname{margin-top:4px;font-size:13px;font-weight:800;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:999px;border:1px solid rgba(255,214,146,.4)}
.fxslash{position:absolute;left:18%;bottom:48px;width:110px;height:110px;border-radius:50%;border:9px solid transparent;border-top-color:rgba(255,147,59,.95);transform:rotate(32deg);filter:drop-shadow(0 0 12px rgba(255,115,25,.8))}
.waterburst{position:absolute;right:18%;bottom:58px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#77d4ff,transparent 68%);opacity:.6;filter:blur(8px)}
.bars{padding:8px 12px 0;position:relative;z-index:2}
.hpbox{margin-bottom:8px}
.hplabel{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:4px;color:#fff3d8}
.hplabel .subtxt{color:#d6c2a6;font-weight:700}
.bar{height:16px;border-radius:999px;background:rgba(15,18,26,.88);border:1px solid rgba(255,223,172,.2);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.fill{height:100%;background:linear-gradient(180deg,#ff7558,#c51818);border-radius:999px}
.fill.blue{background:linear-gradient(180deg,#48a7ff,#0958d3)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px}
.skillbtn{display:flex;flex-direction:column;align-items:center;gap:6px}
.skillbtn button{width:126px;height:126px;border-radius:50%;border:2px solid #f2b15a;background:radial-gradient(circle at 30% 28%,#ffcc7a,#c64017 64%,#5e0f07);color:#fff6df;font-size:20px;font-weight:900;box-shadow:inset 0 3px 10px rgba(255,255,255,.18),0 10px 18px rgba(0,0,0,.38);text-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer}
.skillbtn button.guard{background:radial-gradient(circle at 30% 28%,#90d5ff,#2d7ceb 62%,#0f306d)}
.skillbtn small{color:#e6cd9a;font-size:12px}
.sectiontitle{font-size:17px;font-weight:900;color:#ffebb7;display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.heroBanner,.forgeBanner{position:relative;overflow:hidden;border-radius:18px;border:1px solid rgba(192,142,70,.75);background:#111}
.heroBanner{min-height:230px;background:linear-gradient(180deg,rgba(15,17,21,.15),rgba(0,0,0,.4)),url('assets/art/dungeon.webp') center/cover no-repeat}
.heroBanner .heroimg{position:absolute;inset:0;background:url('assets/art/hero_guard.webp') center/contain no-repeat}
.forgeBanner{min-height:188px;background:linear-gradient(180deg,rgba(15,8,4,.15),rgba(0,0,0,.38)),url('assets/art/forge.webp') center/cover no-repeat}
.forgeBanner .smith{position:absolute;inset:0;background:url('assets/art/smith.webp') center/contain no-repeat}
.speech{position:absolute;right:12px;top:14px;max-width:135px;background:#f0ddbc;color:#5a3815;padding:10px;border-radius:12px 12px 4px 12px;font-weight:800;font-size:14px;line-height:1.35;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.forgeTabs,.codexTabs,.slotTabs,.categoryTabs,.subnav{display:flex;gap:8px;flex-wrap:wrap}
.segbtn{padding:9px 14px;border-radius:12px;border:1px solid rgba(195,153,90,.72);background:linear-gradient(180deg,#2f241a,#171515);color:#f2dab4;font-weight:900;cursor:pointer}
.segbtn.active{background:linear-gradient(180deg,#5e240f,#251515);color:#fff1d1;box-shadow:0 0 0 1px rgba(255,160,76,.35) inset,0 0 16px rgba(238,97,32,.14)}
.categoryTabs .segbtn.active.altblue{background:linear-gradient(180deg,#21458e,#131b3b);box-shadow:0 0 0 1px rgba(130,186,255,.35) inset,0 0 16px rgba(79,151,255,.18)}
.cardsRow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.equipCard{background:linear-gradient(180deg,#181a20,#0d0f14);border:1px solid rgba(221,174,95,.55);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.equipThumb{width:100%;aspect-ratio:1/1;border-radius:10px;background:#0d0f14 center/cover no-repeat;border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden}
.equipThumb .tierbadge{position:absolute;left:6px;bottom:6px;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.7);font-weight:900;font-size:12px}
.equipCard .name{font-size:12px;text-align:center;color:#e9dbbe;font-weight:800;line-height:1.3;min-height:32px}
.focusGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.focusBox{padding:12px 8px;border-radius:14px;border:1px solid rgba(198,154,89,.7);background:linear-gradient(180deg,#17191f,#101115);text-align:center;cursor:pointer}
.focusBox.active.red{background:linear-gradient(180deg,#692418,#231010)}
.focusBox.active.blue{background:linear-gradient(180deg,#21458a,#11172d)}
.focusBox.active.neutral{background:linear-gradient(180deg,#57462c,#171514)}
.costRow{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:14px;color:#f6deb0;gap:8px}
.primaryBtn{width:100%;border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,#ffd78b,#c8821b 62%,#8f5710);color:#392108;font-size:21px;font-weight:900;box-shadow:inset 0 2px 10px rgba(255,255,255,.2),0 10px 18px rgba(0,0,0,.35);cursor:pointer}
.inlineCheck{display:flex;align-items:center;gap:8px;font-weight:800;color:#f1ddbf;font-size:14px;justify-content:flex-end;margin-top:10px}
.charwrap{display:grid;grid-template-columns:84px 1fr 84px;gap:8px;align-items:center}
.slotcol{display:flex;flex-direction:column;gap:8px}
.slot{height:76px;border-radius:16px;border:1px solid rgba(203,154,83,.75);background:linear-gradient(180deg,#13151b,#090b10);display:grid;place-items:center;overflow:hidden;position:relative}
.slot img{width:100%;height:100%;object-fit:cover}
.slot .slotlabel{position:absolute;right:6px;top:6px;font-size:11px;background:rgba(0,0,0,.68);padding:2px 5px;border-radius:999px}
.charstage{min-height:228px;border-radius:20px;border:1px solid rgba(204,159,90,.75);background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.42)),url('assets/art/dungeon.webp') center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden}
.charstage img{max-width:78%;max-height:214px;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55))}
.statsBox{margin-top:10px;padding:12px;border-radius:16px;border:1px solid rgba(192,152,87,.75);background:linear-gradient(180deg,#14161d,#0c0d12)}
.statrow{display:flex;justify-content:space-between;gap:8px;margin:7px 0;font-weight:800;font-size:15px}.statrow .up{color:#78d985}
.inventoryGrid,.codexGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.invItem{background:linear-gradient(180deg,#171920,#0c0e12);border:1px solid rgba(190,146,81,.55);border-radius:14px;padding:6px;min-height:108px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:flex-start}
.invItem .mini{width:100%;aspect-ratio:1;border-radius:10px;background:#111 center/cover no-repeat;border:1px solid rgba(255,255,255,.08);position:relative}
.invItem .mini .rar{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.66);padding:2px 5px;border-radius:999px;font-size:11px;font-weight:900}
.invItem .txt{font-size:12px;text-align:center;font-weight:800;color:#e9dabb;line-height:1.25}
.invItem button{border:0;background:linear-gradient(180deg,#444854,#1a1d25);color:#f6deb0;border-radius:10px;padding:8px 0;width:100%;font-weight:900;cursor:pointer}
.paper{background:linear-gradient(180deg,#ead6b1,#d2b187 70%,#c79e71);color:#3f2715;border-radius:18px;border:2px solid #8a6033;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 20px rgba(0,0,0,.24)}
.paperTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.paperTop strong{font-size:18px}.progress{height:14px;background:#816342;border-radius:999px;overflow:hidden;margin:8px 0 4px;border:1px solid rgba(76,50,20,.45)}.progress span{display:block;height:100%;background:linear-gradient(90deg,#7fcf63,#bdd85f)}
.codexWrap{display:grid;grid-template-columns:82px 1fr;gap:10px;margin-top:10px}
.codexSide{display:flex;flex-direction:column;gap:8px}.sideTab{background:#342417;color:#f5e2be;border-radius:14px;border:1px solid #885d31;padding:10px 8px;text-align:center;font-size:13px;font-weight:900;cursor:pointer}.sideTab.active{background:linear-gradient(180deg,#6f350d,#34190d)}
.codexItem{background:linear-gradient(180deg,#2b2218,#130f0c);border:1px solid rgba(134,90,38,.66);border-radius:12px;padding:4px;aspect-ratio:1;position:relative;overflow:hidden}
.codexItem img{width:100%;height:100%;object-fit:cover;border-radius:9px;opacity:.97}.codexItem.locked img{filter:brightness(.15)}
.codexItem .label{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.72);color:#fff;padding:2px 4px;border-radius:999px;font-size:10px;font-weight:900}
.shopHero{min-height:180px;border-radius:18px;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.4)),url('assets/art/forge.webp') center/cover no-repeat;border:1px solid rgba(196,151,83,.75);padding:14px;display:flex;align-items:flex-end}
.shopHero .msg{background:rgba(10,8,7,.72);border:1px solid rgba(230,183,103,.65);padding:12px 14px;border-radius:16px;max-width:70%;font-weight:900;color:#ffebb8}
.shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.shopItem{padding:12px;border-radius:16px;background:linear-gradient(180deg,#161a20,#0b0d11);border:1px solid rgba(187,145,83,.6)}
.shopItem h4{margin:0 0 8px;font-size:16px}.shopItem p{margin:0 0 10px;color:#d6c0a3;font-size:13px;line-height:1.45}.shopItem button{width:100%;border:0;border-radius:12px;padding:10px;background:linear-gradient(180deg,#ffe49c,#ca8a23);font-weight:900;color:#39240a}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(460px,100%);padding:8px 8px max(10px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,14,10,.97),rgba(8,8,10,.98));border-top:1px solid rgba(213,162,91,.5);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.nav button{border:0;background:transparent;color:#e7d3ad;padding:8px 4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;cursor:pointer}
.nav button.active{background:linear-gradient(180deg,rgba(255,197,106,.18),rgba(255,125,21,.15));box-shadow:inset 0 0 0 1px rgba(255,196,112,.3);color:#fff4d7}
.nav .icon{font-size:20px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);max-width:92vw;padding:11px 14px;border-radius:14px;background:#f6dfbb;color:#482b12;font-weight:900;box-shadow:0 10px 20px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#toast.show{opacity:1}
.muted{color:#d7bf95}.tiny{font-size:12px}.right{display:flex;justify-content:flex-end}.hide{display:none}
.r0{color:#c7cdd9}.r1{color:#7bd965}.r2{color:#49a4ff}.r3{color:#c46cff}.r4{color:#ff9b2f}
@media (max-width:390px){
  .reschip{min-width:66px;font-size:12px}.brandtitle{font-size:31px}.battlefield{min-height:320px}.skillbtn button{width:112px;height:112px}.inventoryGrid,.codexGrid{grid-template-columns:repeat(3,1fr)}
}

/* Day 8: production icon slots, battle telegraph, craft reveal, codex */
.equipThumb,.slot img,.mini,.codexItem img{object-fit:cover}
.itemIcon{width:100%;height:100%;object-fit:contain;display:block;border-radius:9px}
.combatAlert{position:absolute;left:10px;top:10px;right:82px;border:1px solid #ffc16e;background:linear-gradient(90deg,#632d1cee,#251920e8);padding:9px;border-radius:10px;color:#ffe1a5;font-weight:900;text-align:center;font-size:12px;z-index:5;text-shadow:0 2px 4px #000}
.combatAlert.danger{background:linear-gradient(90deg,#b12721ee,#4a1419ef);box-shadow:0 0 22px #f33b2b77;animation:warnPulse .45s ease-in-out infinite alternate}
@keyframes warnPulse{to{filter:brightness(1.5)}}
.guardSuccess{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:8;font-weight:1000;color:#d7f2ff;font-size:24px;text-shadow:0 0 14px #31b3ff,0 3px 5px #000;pointer-events:none;animation:rise .8s ease forwards}
@keyframes rise{to{transform:translate(-50%,-100%);opacity:0}}
.craftOverlay{position:fixed;inset:0;z-index:130;background:#050608d9;display:none;align-items:center;justify-content:center;padding:20px}
.craftOverlay.show{display:flex}
.craftModal{max-width:340px;width:100%;border:2px solid #d9a65b;border-radius:24px;padding:20px;background:radial-gradient(circle at 50% 8%,#693f20,#19141d 70%);box-shadow:0 0 38px #ef9b3f55;text-align:center}
.craftModal .beam{font-size:42px;display:block;animation:hammerDrop .65s ease-in-out 2}
@keyframes hammerDrop{50%{transform:translateY(16px) rotate(-25deg)}}
.craftModal .craftedIcon{height:124px;width:124px;object-fit:contain;margin:8px auto;filter:drop-shadow(0 0 15px #ffcc69)}
.craftModal .grade{font-size:23px;color:#ffe08e;font-weight:1000;margin:6px 0}
.craftModal button{margin-top:12px;border:1px solid #ffe3a7;border-radius:14px;background:linear-gradient(#ffe09a,#ca852c);padding:12px 26px;font-size:17px;font-weight:900;color:#34210c}
.codexMonsterGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.codexMonsterGrid .panel{text-align:center;padding:10px}
.codexMonsterGrid img{width:100%;height:125px;object-fit:contain}
.elementPills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.elementPills span{padding:6px 9px;border:1px solid #9c783d;border-radius:99px;background:#241f26;color:#f7ddb3;font-weight:900;font-size:12px}
.researchNote{font-size:12px;color:#e4ca9f;line-height:1.6}

/* Interactive blacksmith systems */
.forgeTabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.forgeTabs .segbtn{font-size:12px;min-width:0;padding:10px 2px}
.forgeOperations{padding:12px 2px}
.forgeOpsHead{display:flex;justify-content:space-between;gap:8px;color:#f5dcaa;font-size:13px;margin:10px 0}
.forgeList{max-height:380px;overflow-y:auto;display:grid;gap:7px;padding:3px}
.forgeRow{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:7px;background:linear-gradient(#313541,#171a22);color:#ffe8c5;border:1px solid #977046;border-radius:12px;box-shadow:none;min-height:66px}
.forgeRow img{width:50px;height:50px;object-fit:contain;background:#151620;border-radius:8px}
.forgeRow span{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.forgeRow small{font-size:11px}.forgeRow strong{font-size:18px}
.forgeRow.chosen{border:2px solid #ffbb61;background:linear-gradient(#56402e,#241c20);box-shadow:0 0 13px #ed9e4e44}
.forgeRow.equipped{opacity:.8}
.forgeOpsCost{font-size:13px;color:#ffe0a4;padding:13px 4px}
</style>
</head>

    <div id="screen"></div>
  </section>
</main>

<script>
const K='dungeon-forge-ui-v2';
const rarityName=['일반','고급','희귀','영웅','전설'];
const rarityLetter=['C','B','A','S','SS'];
const navTabs=['던전','대장간','장비','도감','상점'];
const areaNames=['잊힌 지하 수도','왕관 슬라임 굴','용광로 회랑','거암 통로','폭풍 첨탑'];
const recipeDefs=[
  {name:'화염의 검',kind:'weapon',ore:10,crystal:0,img:'assets/art/weapons.webp',atk:[22,28,36,44,52],def:[0,0,0,0,0]},

  {name:'빛의 방패',kind:'shield',ore:9,crystal:1,img:'assets/art/shields.webp',atk:[0,0,0,0,0],def:[14,20,28,36,45]},
  {name:'심연의 반지',kind:'ring',ore:8,crystal:2,img:'assets/art/rings.webp',atk:[6,10,14,18,24],def:[6,8,12,15,18]}
];

let pendingBossAttack=Date.now()+5500, craftOverlayOpen=false, battleFxUntil=0;
const stateInit=()=>({gold:125420,ore:3260,crystals:1850,stage:12,hp:1280,maxHp:1280,enemyHp:1200,enemyMax:1200,inventory:[],equip:{weapon:null,armor:null,shield:null,ring:null},discovered:[],focus:'attack',craftTab:'weapon',codexTab:'equipment',codexSide:'weapon',kills:0,boss:false,last:Date.now()});
let S=stateInit();
let TAB='던전';
let strikeReady=0,guardReady=0,guardActiveUntil=0;
let logs=[];
try{const saved=JSON.parse(localStorage.getItem(K)); if(saved){S={...stateInit(),...saved};}}
catch(e){}

function normalizeState(){['weapon','armor','shield','ring'].forEach(k=>{ if(S.equip[k]===undefined) S.equip[k]=null;}); S.maxHp=getMaxHp(); S.hp=Math.min(S.hp||S.maxHp,S.maxHp); S.enemyMax=getEnemyMax(); S.enemyHp=Math.min(S.enemyHp||S.enemyMax,S.enemyMax);}
function seedStarterItems(){
  const starters=[
    mkItem(recipeDefs[0],4,'화상'), mkItem(recipeDefs[0],2,'흡혈'), mkItem(recipeDefs[1],3,'견고함'), mkItem(recipeDefs[2],2,'보호막'), mkItem(recipeDefs[3],3,'반격'), mkItem(recipeDefs[3],1,'냉기')
  ];
  starters.forEach(it=>{const idx=S.inventory.push(it)-1;if(S.equip[it.kind]===null)S.equip[it.kind]=idx;discover(it)});
}
function mkItem(def,tier,effect){return {name:def.name,kind:def.kind,tier,effect,power:def.atk[tier],defense:def.def[tier],img:def.img,id:cryptoRandom()};}
function cryptoRandom(){return Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4)}
function save(){S.last=Date.now();localStorage.setItem(K,JSON.stringify(S));}
function toast(t){logs.unshift(t);logs=logs.slice(0,3);const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700); save(); render();}
function eq(kind){return S.equip[kind]!==null?S.inventory[S.equip[kind]]:null}
function totalAtk(){return 120+(eq('weapon')?.power||0)+(eq('ring')?.power||0)+S.stage*8}
function totalDef(){return 60+(eq('armor')?.defense||0)+(eq('shield')?.defense||0)+(eq('ring')?.defense||0)+S.stage*12}
function getMaxHp(){return 1280+(eq('armor')?.defense||0)*6+(eq('shield')?.defense||0)*3+S.stage*20}
function getEnemyMax(){return 880+S.stage*25+(S.boss?520:0)}
function currentEnemyName(){return S.boss?'마그마 슬라임':'왕관 슬라임'}
function currentEnemyImg(){return S.boss?'assets/art/magma.webp':'assets/art/slime.webp'}
function discover(item){const key=[item.kind,item.name,item.tier,item.effect].join('|'); if(!S.discovered.includes(key)) S.discovered.push(key)}
function progressRate(){return Math.min(100,Math.round(S.discovered.length/150*100))}
function rarityClass(t){return 'r'+t}
function areaName(){return areaNames[S.stage % areaNames.length]}
function strike(){if(Date.now()<strikeReady)return toast('강타가 아직 준비되지 않았습니다'); strikeReady=Date.now()+7000; const dmg=Math.round(totalAtk()*1.6); damageEnemy(dmg); toast('강타! '+dmg+' 피해');}
function guard(){if(Date.now()<guardReady)return toast('방어가 아직 준비되지 않았습니다'); guardReady=Date.now()+5500; guardActiveUntil=Date.now()+1500; toast('방어 자세! 잠시 받는 피해 감소'); render();}
function damageEnemy(d){S.enemyHp-=d; if(S.enemyHp<=0) enemyDown(); save(); render();}
function takeDamage(base){let dmg=base*(100/(100+totalDef())); if(Date.now()<guardActiveUntil){dmg*=0.35;if(S.boss){S.ore+=2;battleFxUntil=Date.now()+1000;}} if(eq('shield')?.effect==='보호막')dmg*=0.88; S.hp-=dmg; if(eq('ring')?.effect==='반격') S.enemyHp-=10; if(S.enemyHp<=0) enemyDown(); if(S.hp<=0){S.maxHp=getMaxHp(); S.hp=S.maxHp; S.enemyMax=getEnemyMax(); S.enemyHp=S.enemyMax; toast('패배했지만 다시 도전할 수 있습니다');} save(); render();}
function enemyDown(){S.gold+=520+S.stage*32; S.ore+=22+Math.floor(S.stage/3); S.crystals+=S.boss?8:1; S.kills++; if(eq('weapon')?.effect==='흡혈') S.hp=Math.min(getMaxHp(),S.hp+80); if(S.boss){S.stage++; S.boss=false; toast('보스 격파! 다음 스테이지 개방');} else {toast('몬스터 처치! 재료 획득'); if(S.kills%4===0) {S.boss=true; pendingBossAttack=Date.now()+5500; toast('보스 등장! 방어 타이밍에 주의');}} S.maxHp=getMaxHp(); S.enemyMax=getEnemyMax(); S.enemyHp=S.enemyMax; save(); render();}
function craft(kind=S.craftTab){const def=recipeDefs.find(r=>r.kind===kind); const extra=S.focus==='balanced'?0:1; const needOre=def.ore, needCry=def.crystal+extra; if(S.ore<needOre||S.crystals<needCry) return toast('재료가 부족합니다'); S.ore-=needOre; S.crystals-=needCry; const roll=Math.random(); const tier=roll>.99?4:roll>.94?3:roll>.82?2:roll>.57?1:0; const ef=effects[Math.floor(Math.random()*effects.length)]; const item=mkItem(def,tier,ef); if(S.focus==='attack') item.power+=4; if(S.focus==='defense') item.defense+=5; const idx=S.inventory.push(item)-1; discover(item); S.equip[kind]=idx; S.maxHp=getMaxHp(); S.hp=Math.min(S.hp,S.maxHp); toast(rarityName[tier]+' '+def.name+' 제작!'); save(); render();showCraft(item);}
function showCraft(item){craftOverlayOpen=true;document.getElementById('craftModal').innerHTML=`<span class="beam">⚒ ✦</span><div class="grade ${rarityClass(item.tier)}">${rarityName[item.tier]} 제작 성공!</div><img class="craftedIcon" src="${iconFor(item)}" alt="제작된 장비"><div style="font-weight:900">${item.name}</div><p class="researchNote">특수 효과: ${item.effect}<br>공격 +${item.power} · 방어 +${item.defense}</p><button onclick="closeCraft()">확인</button>`;document.getElementById('craftOverlay').classList.add('show')}
function closeCraft(){craftOverlayOpen=false;document.getElementById('craftOverlay').classList.remove('show')}
function equipItem(index){const it=S.inventory[index]; S.equip[it.kind]=index; S.maxHp=getMaxHp(); S.hp=Math.min(S.hp,S.maxHp); toast(it.name+' 장착');}
function isEquipped(i){return Object.values(S.equip).includes(i)}

function recipeCard(def,tier=4){return `<div class="equipCard"><div class="equipThumb" style="background-image:url('assets/art/items/${iconDir[def.kind]}/${Math.min(5,tier+1)}.webp')"><span class="tierbadge ${rarityClass(tier)}">${rarityLetter[tier]}</span></div><div class="name">${def.name}</div></div>`}

</div>
`;}
function render(){normalizeState(); const view = TAB==='던전'?renderDungeon():TAB==='대장간'?renderForge():TAB==='장비'?renderEquipment():TAB==='도감'?renderCodex():renderShop(); document.getElementById('screen').innerHTML=view; document.getElementById('nav').innerHTML=navTabs.map(t=>`<button class="${t===TAB?'active':''}" onclick="TAB='${t}';render()"><span class="icon">${t==='던전'?'🏰':t==='대장간'?'⚒️':t==='장비'?'🛡️':t==='도감'?'📖':'🛒'}</span><span>${t}</span></button>`).join(''); }
function tickCombat(){ if(TAB!=='던전') return; damageEnemy(Math.max(18,Math.round(totalAtk()*0.16))); if(Math.random()<0.72) takeDamage(90+S.stage*6+(S.boss?80:0)); }
render();
setInterval(()=>{ if(TAB==='던전'){ const auto=Math.max(10,Math.round(totalAtk()*0.11)); S.enemyHp-=auto; if(eq('weapon')?.effect==='화상') S.enemyHp-=6; if(S.enemyHp<=0) enemyDown(); render(); } }, 1300);
setInterval(()=>{ if(TAB==='던전'){if(S.boss){if(Date.now()>=pendingBossAttack){takeDamage(180+S.stage*7);pendingBossAttack=Date.now()+5500;}}else{takeDamage(85+S.stage*5);}}},2200);
setInterval(()=>{const el=document.getElementById('combatAlert');if(!el||TAB!=='던전'||!S.boss)return;const remain=Math.max(0,(pendingBossAttack-Date.now())/1000);el.style.display='block';el.classList.toggle('danger',remain<1.8);el.textContent=remain<1.8?'⚠ 강공격 임박! 방어!':'보스 강공격까지 '+remain.toFixed(1)+'초';const fx=document.getElementById('battleEffect');if(fx)fx.innerHTML=Date.now()<battleFxUntil?'<span class="guardSuccess">완벽 방어! 광석 +2</span>':'';},150);
setInterval(save,10000);
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>document.hidden&&save());
</script>
<script src="forge.js"></script>
</body>
