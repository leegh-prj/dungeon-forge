background:transparent;color:#a4b7d1;border-radius:10px;min-height:49px;padding:7px 4px;font-size:13px}.tabs button.active{background:#3d5374;color:#ffe1a6}.item{padding:12px;background:#34455e;border-radius:12px;margin:9px 0;border:1px solid #536882}.itemrow{display:flex;align-items:center;gap:12px}.itemrow .symbol{font-size:35px;min-width:43px}.itemrow .info{flex:1}.itemrow button{white-space:nowrap}.rarity{font-size:12px;font-weight:800}.rare0{color:#c3c7cb}.rare1{color:#8cdcaa}.rare2{color:#80b5ff}.rare3{color:#c5a0ff}.rare4{color:#ffd16c}.log{min-height:44px;color:#d3dfef;font-size:13px;line-height:1.6}.bosswarning{margin:10px 0;padding:9px;border:1px solid #ba7890;border-radius:10px;background:#53364e;font-size:14px;font-weight:800}.hint{font-size:12px;color:#bac9db;line-height:1.7}.choice{width:100%;margin-top:8px}.badge{color:#72dda8}#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:92%;width:max-content;background:#f8d29f;color:#283043;border-radius:11px;padding:10px 14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;font-size:13px;font-weight:700}#toast.show{opacity:1}

/* Dungeon Forge visual system v1: forge-gold / dungeon-blue / stone-metal */
:root{--bg:#10141f;--stone:#222633;--stoneHi:#343849;--gold:#f5d08b;--frame:#b9894b;--fire:#f29c47;--ice:#62c5f5;--ink:#f7ebd9}
body{background:radial-gradient(circle at 50% 0%,#374058 0%,#0e131e 58%);color:var(--ink)}
#app{max-width:490px;background:linear-gradient(168deg,#252b3b 0%,#101824 48%,#1c1a22 100%);padding:17px 15px 106px;box-shadow:0 0 0 2px #7d603d,0 0 45px #000b;position:relative;overflow:hidden}

.sub{color:#d8b980;letter-spacing:1px;font-size:11px}
.resources{position:relative;gap:6px}

.card{background:linear-gradient(155deg,#303545,#20232f 60%,#211f28);border:1px solid #9c794b;border-radius:15px;box-shadow:inset 0 1px #fff2,inset 0 -3px #0b0c1440,0 6px 18px #0005;position:relative}
.card:before{content:"";position:absolute;pointer-events:none;inset:4px;border:1px solid #e7b76a13;border-radius:11px}
button{background:linear-gradient(180deg,#ffda83,#e99a37 60%,#ab602c);color:#352017;border:1px solid #ffdd87;box-shadow:inset 0 2px #fff6,0 3px 0 #68391f,0 5px 10px #0004;text-shadow:0 1px #ffffff4d;transition:transform .1s,filter .1s}
button:active{transform:translateY(2px);box-shadow:inset 0 1px #fff4,0 1px 0 #68391f}
button.secondary{background:linear-gradient(#53617b,#343d57);border-color:#8895b1;color:#fff0d6;text-shadow:0 1px #101a29}

.tabs button.active{background:linear-gradient(#514b46,#342e35);border:1px solid #d2a661;color:#ffe09c;box-shadow:inset 0 1px #ffda8b40,0 0 10px #df983433}
.item{background:linear-gradient(115deg,#3c404e,#282b39);border:1px solid #917751;box-shadow:inset 0 1px #ffffff18,0 3px 9px #0003}
.symbol{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#6e6480,#292937);border:1px solid #ad8a59;border-radius:12px;min-width:50px!important;height:52px;text-shadow:0 0 10px #fff7}
.scene{height:220px;border:2px solid #6c96a8;background:radial-gradient(ellipse at center bottom,#32739e 0%,#1c4b72 33%,#182c49 70%,#0c2035 100%);box-shadow:inset 0 0 40px #061420,0 0 10px #45799b3d}
.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#121c28a9,transparent 50%),repeating-linear-gradient(104deg,transparent 0 38px,#81d6ef08 40px 42px);pointer-events:none}
.scene .hero,.scene .monster{position:relative;z-index:1;font-size:82px;animation:float-char 2.1s ease-in-out infinite}
.scene .monster{animation-delay:.35s;filter:drop-shadow(0 0 14px #79cfff99)}
@keyframes float-char{50%{transform:translateY(-6px)}}
.bar{height:14px;border:1px solid #977f67;background:#0f1722}
.bar>span{background:linear-gradient(#abf1b3,#4fa57f)}
.bar.red>span{background:linear-gradient(#ffad9d,#bf3c56)}
.bosswarning{border:1px solid #f5b866;background:linear-gradient(#673844,#3c293d);box-shadow:0 0 12px #f7754e3b}

.rare4{text-shadow:0 0 7px #ffbd52}

@media(max-width:370px){#app{padding-left:10px;padding-right:10px}.card{padding:13px}.itemrow{gap:7px}.itemrow button{padding:9px 7px}.resources{gap:4px}}


.forge-art{height:155px;position:relative;margin:10px 0 14px;overflow:hidden;border-radius:14px;border:2px solid #ab7348;background:radial-gradient(ellipse at 53% 80%,#d16b20 0%,#6b3521 35%,#312630 70%,#1c1e29);box-shadow:inset 0 0 35px #160a0c,0 3px 12px #0005}

.forge-art:before{left:-20%}.forge-art:after{right:-20%}
.furnace{position:absolute;font-size:94px;left:13%;bottom:-30px;filter:drop-shadow(0 0 26px #ff9b29);animation:float-char 2.4s ease-in-out infinite}

.sparks{position:absolute;left:34%;top:13px;color:#ffd28b;font-size:26px;letter-spacing:12px;text-shadow:0 0 9px #ffaa35}
.forge-name{position:absolute;top:13px;left:12px;font-size:10px;letter-spacing:2px;color:#ffdfa0}

/* Day 5: original game concept art crops, progressively enhanced (fallbacks keep gameplay usable) */
.scene{background-image:linear-gradient(0deg,#0b1625d6,#122a42a3),url("assets/art/dungeon.webp");background-size:cover;background-position:center}
.scene .hero,.scene .monster{font-size:0;display:flex;align-items:flex-end;justify-content:center;width:45%;height:90%;position:relative}

.forge-art{height:235px}.forge-art .art-forge-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.54}

.forge-name{z-index:3;text-shadow:0 2px 3px #000}
.equipment-hero{height:185px;position:relative;border-radius:14px;background:radial-gradient(circle at 70% 40%,#845b38,#24374c 58%,#161c2b);overflow:hidden;border:1px solid #ae8553;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:8px 0 14px}
.equipment-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.88;object-position:center 42%}
.equipment-hero strong,.equipment-hero small{position:relative;align-self:flex-start;margin-left:12px;background:#131721a8;padding:3px 9px;border-radius:4px;z-index:1;text-shadow:0 2px 5px #000}
.equipment-hero strong{margin-top:auto;color:#ffe4a5}.equipment-hero small{margin-bottom:10px;color:#e4d1b6}
.codex-banner{padding:14px;border:1px solid #c39c60;border-radius:14px;background:linear-gradient(145deg,#584635,#262937);color:#f3d5a7;font-size:13px;text-align:center}
.codex-pics{margin-top:10px;display:flex;gap:6px;max-height:90px}.codex-pics img{min-width:0;width:50%;object-fit:cover;object-position:center;border:1px solid #d9ba87;border-radius:8px}
</style></head><body><div id="toast"></div><main id="app"><h1>⚒ 던전 대장간</h1><div class="sub">CRAFT • DEFEND • EXPLORE &nbsp; | &nbsp; Day 5 · 아트 리소스 적용</div><div id="resources" class="resources"></div><div id="content"></div><div id="log" class="card log"></div></main><nav id="tabs" class="tabs"></nav><script>
const K='dungeon-forge-web-v1';const recipes=[{n:'단검',kind:'weapon',icon:'⚔️',o:6,c:0},{n:'철갑옷',kind:'armor',icon:'🦺',o:9,c:0},{n:'수호 방패',kind:'shield',icon:'🛡️',o:7,c:2},{n:'마력 반지',kind:'ring',icon:'💍',o:4,c:3}], effects=['견고함','화상','흡혈','보호막','반격'],grades=['일반','고급','희귀','영웅','전설'];
const init=()=>({gold:60,ore:20,crystals:5,stage:1,kills:0,inventory:[],equip:{},discovered:{},last:Date.now(),hp:100,enemy:70,boss:false,events:0,rewardReady:0,focus:"balanced"});let s=init(),tab='던전',guardUntil=0,guardReady=0,strikeReady=0,history=[],renderTime=0,nextEnemyAttack=Date.now()+1800;
try{let j=JSON.parse(localStorage.getItem(K));if(j&&j.stage){s={...init(),...j};let sec=Math.max(0,Math.min(28800,Math.floor((Date.now()-(j.last||Date.now()))/1000)));if(sec>59){s.gold+=Math.floor(sec/20);s.ore+=Math.floor(sec/60);history.unshift('오프라인 '+Math.floor(sec/60)+'분: 보상 획득!')}}}catch(e){}
function save(){s.last=Date.now();try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}function log(t){history.unshift(t);history=history.slice(0,3);document.querySelector('#log').innerHTML=history.map(x=>'✦ '+x).join('<br>')}function toast(t){log(t);let el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
const equipped=k=>s.inventory[s.equip[k]]||null;const power=()=>10+s.stage*.8+(equipped('weapon')?.power||0);const defense=()=>3+['armor','shield','ring'].reduce((v,k)=>v+(equipped(k)?.defense||0),0);const has=e=>Object.keys(s.equip).some(k=>equipped(k)?.effect===e);const maxEnemy=()=>70+s.stage*24+(s.boss?130:0);function victory(){s.gold+=8+s.stage*3;s.ore+=2+Math.floor(s.stage/4);s.kills++;s.events++;if(s.boss){s.crystals+=2;s.stage++;s.boss=false;toast('보스 격파! 다음 층 개방 · 결정 +2')}else if(s.kills%5===0){s.boss=true;toast('⚡ 보스 등장! 방어 타이밍에 주의')};if(s.events>=7){s.events=0;event()}s.enemy=maxEnemy();nextEnemyAttack=Date.now()+(s.boss?4500:1800);s.hp=Math.min(100,s.hp+12);save()}
function hit(){s.enemy-=power()+(has('화상')?5:0);if(has('흡혈'))s.hp=Math.min(100,s.hp+3);if(s.enemy<=0)victory()}
function hurt(){let raw=9+s.stage*2.8+(s.boss?15:0);let dmg=raw*100/(100+defense());let blocked=Date.now()<guardUntil;if(blocked)dmg*=.25;if(has('보호막'))dmg*=.85;if(blocked&&s.boss){s.ore+=2;toast('🛡 보스 공격 방어 성공! 광석 +2')}s.hp-=dmg;if(has('반격'))s.enemy-=4;if(s.enemy<=0)victory();if(s.hp<=0){s.hp=100;s.enemy=maxEnemy();toast('패배! 재화 손실 없이 재도전 가능')} }
function guard(){if(Date.now()<guardReady)return;guardUntil=Date.now()+1300;guardReady=Date.now()+5500;toast('🛡 방어 자세! 1.3초 동안 피해 75% 감소');render()}
function strike(){if(Date.now()<strikeReady)return;strikeReady=Date.now()+10000;let damage=Math.round(power()*3.2);s.enemy-=damage;toast('⚔ 강타! '+damage+' 피해');if(s.enemy<=0)victory();render()}
function event(){const a=Math.floor(Math.random()*3);if(a===0){s.crystals++;toast('🎁 신비한 보물상자: 결정 +1')}else if(a===1){s.ore+=8;toast('⛏ 숨겨진 광맥: 광석 +8')}else{s.gold+=35;toast('🪙 떠돌이 상인: 골드 +35')}}
function craft(i){const r=recipes[i],extra=s.focus==="balanced"?0:1;if(s.ore<r.o||s.crystals<r.c+extra)return toast('재료가 부족합니다');s.ore-=r.o;s.crystals-=r.c+extra;let x=Math.random(),tier=x>=.99?4:x>=.95?3:x>=.85?2:x>=.60?1:0;let item={name:r.n,kind:r.kind,icon:r.icon,tier,effect:effects[Math.floor(Math.random()*effects.length)],power:r.kind==='weapon'?6+5*tier+(s.focus==='attack'?3:0):0,defense:r.kind==='weapon'?0:3+4*tier+(s.focus==='defense'?3:0)};let idx=s.inventory.push(item)-1;s.discovered[[item.name,tier,item.effect].join('-')]=1;if(s.equip[r.kind]===undefined)s.equip[r.kind]=idx;toast('✨ '+grades[tier]+' '+r.n+' 제작! '+item.effect);save();render()}
function equip(i){s.equip[s.inventory[i].kind]=i;toast(s.inventory[i].name+' 장착');save();render()}
function focus(v){s.focus=v;save();render()}function claim(){if(Date.now()<s.rewardReady)return toast('탐험 보상은 60초마다 받을 수 있습니다');s.rewardReady=Date.now()+60000;s.gold+=20;s.ore+=10;toast('탐험 보상: 골드 +20 · 광석 +10');save();render()}function res(){return `<div class="res">🪙 ${s.gold}</div><div class="res">⛏ ${s.ore}</div><div class="res">✦ ${s.crystals}</div>`}
function render(){document.querySelector('#resources').innerHTML=res();const nav=document.querySelector('#tabs');if(nav.dataset.active!==tab){nav.innerHTML=['던전','대장간','장비','도감'].map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t==='던전'?'🏰':t==='대장간'?'⚒':t==='장비'?'🛡':'📖'}<br>${t}</button>`).join('');nav.dataset.active=tab}let c=document.querySelector('#content');if(tab==='던전'){let ec=Math.min(100,Math.max(0,s.enemy/maxEnemy()*100));c.innerHTML=`<section class="card stage"><h2>🏰 ${s.stage}층 · ${s.boss?'보스전':'슬라임 숲'}</h2>${s.boss?`<div class="bosswarning" style="color:${nextEnemyAttack-Date.now()<1700?'#ff8e96':'#ffe0a4'}">${nextEnemyAttack-Date.now()<1700?'⚠ 강력한 공격 임박! 지금 방어하세요':'👹 보스 공격까지 '+Math.max(0,((nextEnemyAttack-Date.now())/1000)).toFixed(1)+'초'}</div>`:''}<div class="scene"><span class="hero"><img src="assets/art/hero.webp" alt="붉은 망토를 입은 모험가" onerror="this.remove()"><span class="art-fallback">🧙‍♂️</span></span><span class="vs">VS</span><span class="monster"><img src="${s.boss?'assets/art/magma.webp':'assets/art/slime.webp'}" alt="${s.boss?'마그마 슬라임 보스':'왕관 슬라임'}" onerror="this.remove()"><span class="art-fallback">${s.boss?'👹':'🟢'}</span></span></div><p class="stats"><span>영웅 HP ${Math.max(0,Math.ceil(s.hp))}/100</span><span>공격 ${Math.round(power())} · 방어 ${Math.round(defense())}</span></p><div class="bar"><span style="width:${Math.max(0,s.hp)}%"></span></div><p class="stats"><span>${s.boss?'보스':'몬스터'}</span><span>HP ${Math.max(0,Math.ceil(s.enemy))}/${maxEnemy()}</span></p><div class="bar red"><span style="width:${ec}%"></span></div><div class="actions"><button onclick="strike()">⚔ 강타 <small>${Math.max(0,Math.ceil((strikeReady-Date.now())/1000))||'준비'}</small></button><button class="green" onclick="guard()">🛡 방어 <small>${Math.max(0,Math.ceil((guardReady-Date.now())/1000))||'준비'}</small></button></div></section><section class="card"><h2>⛏ 자동 탐험</h2><p class="hint">자동 전투로 골드와 광석을 얻습니다. 방어 스킬 타이밍은 보스전에서 특히 중요합니다.</p><button class="secondary" onclick="claim()">탐험 보상 수령 (60초 충전)</button></section>`}
else if(tab==='대장간')c.innerHTML=`<h2>🔥 신비한 대장간</h2><div class="forge-art" aria-hidden="true"><img class="art-forge-bg" src="assets/art/forge.webp" alt="" onerror="this.remove()"><img class="art-smith" src="assets/art/smith.webp" alt="" onerror="this.remove()"><div class="furnace">🔥</div><div class="anvil">⚒️</div><div class="sparks">✦ ✧ ✦</div><div class="forge-name">FORGE OF LEGENDS</div></div><p class="hint">원하는 부위를 제작하세요. 제작 등급과 특수 효과는 랜덤입니다.<br>일반 60% · 고급 25% · 희귀 10% · 영웅 4% · 전설 1%</p><div class="actions"><button class="secondary" onclick="focus('balanced')">균형 ${s.focus==='balanced'?'✓':''}</button><button class="secondary" onclick="focus('attack')">공격 +3 ${s.focus==='attack'?'✓':''}</button><button class="secondary" onclick="focus('defense')">방어 +3 ${s.focus==='defense'?'✓':''}</button></div><p class="hint">공격·방어 집중 제작은 마력 결정 1개를 추가 사용합니다.</p>`+recipes.map((r,i)=>`<div class="item itemrow"><div class="symbol">${r.icon}</div><div class="info"><b>${r.n}</b><div class="sub">광석 ${r.o} · 결정 ${r.c+(s.focus==='balanced'?0:1)}</div></div><button onclick="craft(${i})">제작</button></div>`).join('')
else if(tab==='장비')c.innerHTML=`<h2>🛡 장비 및 방어 전략</h2><div class="equipment-hero"><img src="assets/art/hero_guard.webp" alt="방패로 방어하는 주인공" onerror="this.remove()"><strong>대장장이의 전투 장비</strong><small>무기 · 갑옷 · 방패 · 반지</small></div><p class="hint">방어력 ${Math.round(defense())} · 받는 피해는 방어력에 따라 감소.<br>방패와 갑옷을 제작해 보스의 큰 공격을 견뎌보세요.</p>`+(s.inventory.length?s.inventory.map((it,i)=>`<div class="item itemrow"><div class="symbol">${it.icon}</div><div class="info"><span class="rarity rare${it.tier}">${grades[it.tier]}</span> <b>${it.name}</b><div class="sub">공격 +${it.power} · 방어 +${it.defense}</div><div class="sub">특수 효과: ${it.effect}</div></div><button class="${s.equip[it.kind]===i?'green':'secondary'}" onclick="equip(${i})">${s.equip[it.kind]===i?'장착 중':'장착'}</button></div>`).join(''):'<div class="card">장비가 없습니다. 대장간에서 첫 장비를 제작하세요.</div>')
else c.innerHTML=`<h2>📖 발견 도감</h2><div class="codex-banner"><span>✦ 장비·몬스터·지역의 비밀을 밝혀라 ✦</span><div class="codex-pics"><img src="assets/art/weapons.webp" alt="무기 컬렉션" onerror="this.remove()"><img src="assets/art/shields.webp" alt="방패 컬렉션" onerror="this.remove()"></div></div><div class="card"><b class="badge">발견한 조합 ${Object.keys(s.discovered).length}종</b><p class="hint">제작하면 등급·효과 조합이 도감에 등록됩니다. 더 희귀한 장비를 찾아보세요.</p></div>`+(Object.keys(s.discovered).map(x=>`<div class="item">✦ ${x}</div>`).join('')||'<div class="card">아직 발견한 장비가 없습니다.</div>');document.querySelector('#log').innerHTML=history.map(x=>'✦ '+x).join('<br>')}
render();setInterval(()=>{hit();render()},1100);setInterval(()=>{if(Date.now()>=nextEnemyAttack){hurt();nextEnemyAttack=Date.now()+(s.boss?4500:1800);render()}else{const w=document.querySelector('.bosswarning');if(w){const ms=nextEnemyAttack-Date.now();w.textContent=ms<1700?'⚠ 강력한 공격 임박! 지금 방어하세요':'👹 보스 공격까지 '+Math.max(0,ms/1000).toFixed(1)+'초';w.style.color=ms<1700?'#ff8e96':'#ffe0a4'}}},120);setInterval(save,8000);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
</script></body></html>
