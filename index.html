<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>던전 대장간 · 프로토타입</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8f1e4;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}#app{max-width:490px;min-height:100dvh;margin:auto;background:linear-gradient(#202e4b,#151d31 45%);padding:18px 16px 90px}h1{font-size:25px;color:#ffd07f;margin:4px 0 9px}h2{font-size:20px;margin:8px 0 12px}.sub{color:#a8b9d1;font-size:13px}.resources{display:flex;gap:7px;margin:14px 0 18px}.res{flex:1;background:#34425c;border:1px solid #53627b;padding:11px 5px;border-radius:12px;text-align:center;font-weight:750}.card{background:#273750;border:1px solid #4c6385;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 6px 22px #0002}.stage{text-align:center}.scene{height:156px;background:radial-gradient(ellipse at center bottom,#476986,#263753 72%);border-radius:13px;display:flex;align-items:center;justify-content:center;gap:28px;position:relative;overflow:hidden}.scene:after{content:'✦ ✧ ✦';position:absolute;top:14px;right:17px;color:#dcae70;font-size:14px;letter-spacing:9px}.hero,.monster{font-size:68px;filter:drop-shadow(0 5px 5px #1118)}.vs{font-size:18px;color:#ffda91}button{background:#f1ab61;color:#2a2332;border:0;border-radius:11px;padding:12px 12px;font-weight:800;font-size:14px;cursor:pointer;min-height:45px}button:disabled{opacity:.42}button.secondary{background:#536d94;color:white}button.green{background:#74cca0}.actions{display:flex;gap:9px;margin-top:12px}.actions button{flex:1}.bar{height:11px;border-radius:20px;background:#121e31;overflow:hidden;margin:8px 0}.bar>span{display:block;height:100%;border-radius:20px;background:#7ddea3;transition:width .2s}.bar.red>span{background:#e87983}.stats{display:flex;justify-content:space-between;font-size:13px;color:#c5d0e1}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(490px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#1b2a42;padding:7px 8px max(9px,env(safe-area-inset-bottom));border-top:1px solid #53617f;gap:5px}.tabs button{background:transparent;color:#a4b7d1;border-radius:10px;min-height:49px;padding:7px 4px;font-size:13px}.tabs button.active{background:#3d5374;color:#ffe1a6}.item{padding:12px;background:#34455e;border-radius:12px;margin:9px 0;border:1px solid #536882}.itemrow{display:flex;align-items:center;gap:12px}.itemrow .symbol{font-size:35px;min-width:43px}.itemrow .info{flex:1}.itemrow button{white-space:nowrap}.rarity{font-size:12px;font-weight:800}.rare0{color:#c3c7cb}.rare1{color:#8cdcaa}.rare2{color:#80b5ff}.rare3{color:#c5a0ff}.rare4{color:#ffd16c}.log{min-height:44px;color:#d3dfef;font-size:13px;line-height:1.6}.bosswarning{margin:10px 0;padding:9px;border:1px solid #ba7890;border-radius:10px;background:#53364e;font-size:14px;font-weight:800}.hint{font-size:12px;color:#bac9db;line-height:1.7}.choice{width:100%;margin-top:8px}.badge{color:#72dda8}#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:92%;width:max-content;background:#f8d29f;color:#283043;border-radius:11px;padding:10px 14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;font-size:13px;font-weight:700}#toast.show{opacity:1}
</style></head><body><div id="toast"></div><main id="app"><h1>⚒ 던전 대장간</h1><div class="sub">CRAFT • DEFEND • EXPLORE &nbsp; | &nbsp; Day 3 · 방어 타이밍 업데이트</div><div id="resources" class="resources"></div><div id="content"></div><div id="log" class="card log"></div></main><nav id="tabs" class="tabs"></nav><script>
const K='dungeon-forge-web-v1';const recipes=[{n:'단검',kind:'weapon',icon:'⚔️',o:6,c:0},{n:'철갑옷',kind:'armor',icon:'🦺',o:9,c:0},{n:'수호 방패',kind:'shield',icon:'🛡️',o:7,c:2},{n:'마력 반지',kind:'ring',icon:'💍',o:4,c:3}], effects=['견고함','화상','흡혈','보호막','반격'],grades=['일반','고급','희귀','영웅','전설'];
const init=()=>({gold:60,ore:20,crystals:5,stage:1,kills:0,inventory:[],equip:{},discovered:{},last:Date.now(),hp:100,enemy:70,boss:false,events:0,rewardReady:0,focus:"balanced"});let s=init(),tab='던전',guardUntil=0,guardReady=0,strikeReady=0,history=[],renderTime=0,nextEnemyAttack=Date.now()+1800;
try{let j=JSON.parse(localStorage.getItem(K));if(j&&j.stage){s={...init(),...j};let sec=Math.max(0,Math.min(28800,Math.floor((Date.now()-(j.last||Date.now()))/1000)));if(sec>59){s.gold+=Math.floor(sec/20);s.ore+=Math.floor(sec/60);history.unshift('오프라인 '+Math.floor(sec/60)+'분: 보상 획득!')}}}catch(e){}
function save(){s.last=Date.now();try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}function log(t){history.unshift(t);history=history.slice(0,3);document.querySelector('#log').innerHTML=history.map(x=>'✦ '+x).join('<br>')}function toast(t){log(t);let el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
const equipped=k=>s.inventory[s.equip[k]]||null;const power=()=>10+s.stage*.8+(equipped('weapon')?.power||0);const defense=()=>3+['armor','shield','ring'].reduce((v,k)=>v+(equipped(k)?.defense||0),0);const has=e=>Object.keys(s.equip).some(k=>equipped(k)?.effect===e);const maxEnemy=()=>70+s.stage*24+(s.boss?130:0);function victory(){s.gold+=8+s.stage*3;s.ore+=2+Math.floor(s.stage/4);s.kills++;s.events++;if(s.boss){s.crystals+=2;s.stage++;s.boss=false;toast('보스 격파! 다음 층 개방 · 결정 +2')}else if(s.kills%5===0){s.boss=true;toast('⚡ 보스 등장! 방어 타이밍에 주의')};if(s.events>=7){s.events=0;event()}s.enemy=maxEnemy();nextEnemyAttack=Date.now()+(s.boss?4500:1800);s.hp=Math.min(100,s.hp+12);save()}
function hit(){s.enemy-=power()+(has('화상')?5:0);if(has('흡혈'))s.hp=Math.min(100,s.hp+3);if(s.enemy<=0)victory()}
function hurt(){let raw=9+s.stage*2.8+(s.boss?15:0);let dmg=raw*100/(100+defense());let blocked=Date.now()<guardUntil;if(blocked)dmg*=.25;if(has('보호막'))dmg*=.85;if(blocked&&s.boss){s.ore+=2;toast('🛡 보스 공격 방어 성공! 광석 +2')}s.hp-=dmg;if(has('반격'))s.enemy-=4;if(s.enemy<=0)victory();if(s.hp<=0){s.hp=100;s.enemy=maxEnemy();toast('패배! 재화 손실 없이 재도전 가능')} }
function guard(){if(Date.now()<guardReady)return;guardUntil=Date.now()+1300;guardReady=Date.now()+5500;toast('🛡 방어 자세! 1.3초 동안 피해 75% 감소');render()}
function strike(){if(Date.now()<strikeReady)return;strikeReady=Date.now()+10000;let damage=Math.round(power()*3.2);s.enemy-=damage;toast('⚔ 강타! '+damage+' 피해');if(s.enemy<=0)victory();render()}
function event(){const a=Math.floor(Math.random()*3);if(a===0){s.crystals++;toast('🎁 신비한 보물상자: 결정 +1')}else if(a===1){s.ore+=8;toast('⛏ 숨겨진 광맥: 광석 +8')}else{s.gold+=35;toast('🪙 떠돌이 상인: 골드 +35')}}
function craft(i){const r=recipes[i],extra=s.focus==="balanced"?0:1;if(s.ore<r.o||s.crystals<r.c+extra)return toast('재료가 부족합니다');s.ore-=r.o;s.crystals-=r.c+extra;let x=Math.random(),tier=x>=.99?4:x>=.95?3:x>=.85?2:x>=.60?1:0;let item={name:r.n,kind:r.kind,icon:r.icon,tier,effect:effects[Math.floor(Math.random()*effects.length)],power:r.kind==='weapon'?6+5*tier+(s.focus==='attack'?3:0):0,defense:r.kind==='weapon'?0:3+4*tier+(s.focus==='defense'?3:0)};let idx=s.inventory.push(item)-1;s.discovered[[item.name,tier,item.effect].join('-')]=1;if(s.equip[r.kind]===undefined)s.equip[r.kind]=idx;toast('✨ '+grades[tier]+' '+r.n+' 제작! '+item.effect);save();render()}
function equip(i){s.equip[s.inventory[i].kind]=i;toast(s.inventory[i].name+' 장착');save();render()}
function focus(v){s.focus=v;save();render()}function claim(){if(Date.now()<s.rewardReady)return toast('탐험 보상은 60초마다 받을 수 있습니다');s.rewardReady=Date.now()+60000;s.gold+=20;s.ore+=10;toast('탐험 보상: 골드 +20 · 광석 +10');save();render()}function res(){return `<div class="res">🪙 ${s.gold}</div><div class="res">⛏ ${s.ore}</div><div class="res">✦ ${s.crystals}</div>`}
function render(){document.querySelector('#resources').innerHTML=res();document.querySelector('#tabs').innerHTML=['던전','대장간','장비','도감'].map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t==='던전'?'🏰':t==='대장간'?'⚒':t==='장비'?'🛡':'📖'}<br>${t}</button>`).join('');let c=document.querySelector('#content');if(tab==='던전'){let ec=Math.min(100,Math.max(0,s.enemy/maxEnemy()*100));c.innerHTML=`<section class="card stage"><h2>🏰 ${s.stage}층 · ${s.boss?'보스전':'슬라임 숲'}</h2>${s.boss?`<div class="bosswarning" style="color:${nextEnemyAttack-Date.now()<1700?'#ff8e96':'#ffe0a4'}">${nextEnemyAttack-Date.now()<1700?'⚠ 강력한 공격 임박! 지금 방어하세요':'👹 보스 공격까지 '+Math.max(0,((nextEnemyAttack-Date.now())/1000)).toFixed(1)+'초'}</div>`:''}<div class="scene"><span class="hero">🧙‍♂️</span><span class="vs">VS</span><span class="monster">${s.boss?'👹':'🟢'}</span></div><p class="stats"><span>영웅 HP ${Math.max(0,Math.ceil(s.hp))}/100</span><span>공격 ${Math.round(power())} · 방어 ${Math.round(defense())}</span></p><div class="bar"><span style="width:${Math.max(0,s.hp)}%"></span></div><p class="stats"><span>${s.boss?'보스':'몬스터'}</span><span>HP ${Math.max(0,Math.ceil(s.enemy))}/${maxEnemy()}</span></p><div class="bar red"><span style="width:${ec}%"></span></div><div class="actions"><button onclick="strike()">⚔ 강타 <small>${Math.max(0,Math.ceil((strikeReady-Date.now())/1000))||'준비'}</small></button><button class="green" onclick="guard()">🛡 방어 <small>${Math.max(0,Math.ceil((guardReady-Date.now())/1000))||'준비'}</small></button></div></section><section class="card"><h2>⛏ 자동 탐험</h2><p class="hint">자동 전투로 골드와 광석을 얻습니다. 방어 스킬 타이밍은 보스전에서 특히 중요합니다.</p><button class="secondary" onclick="claim()">탐험 보상 수령 (60초 충전)</button></section>`}
else if(tab==='대장간')c.innerHTML=`<h2>🔥 신비한 대장간</h2><p class="hint">원하는 부위를 제작하세요. 제작 등급과 특수 효과는 랜덤입니다.<br>일반 60% · 고급 25% · 희귀 10% · 영웅 4% · 전설 1%</p><div class="actions"><button class="secondary" onclick="focus('balanced')">균형 ${s.focus==='balanced'?'✓':''}</button><button class="secondary" onclick="focus('attack')">공격 +3 ${s.focus==='attack'?'✓':''}</button><button class="secondary" onclick="focus('defense')">방어 +3 ${s.focus==='defense'?'✓':''}</button></div><p class="hint">공격·방어 집중 제작은 마력 결정 1개를 추가 사용합니다.</p>`+recipes.map((r,i)=>`<div class="item itemrow"><div class="symbol">${r.icon}</div><div class="info"><b>${r.n}</b><div class="sub">광석 ${r.o} · 결정 ${r.c+(s.focus==='balanced'?0:1)}</div></div><button onclick="craft(${i})">제작</button></div>`).join('')
else if(tab==='장비')c.innerHTML=`<h2>🛡 장비 및 방어 전략</h2><p class="hint">방어력 ${Math.round(defense())} · 받는 피해는 방어력에 따라 감소.<br>방패와 갑옷을 제작해 보스의 큰 공격을 견뎌보세요.</p>`+(s.inventory.length?s.inventory.map((it,i)=>`<div class="item itemrow"><div class="symbol">${it.icon}</div><div class="info"><span class="rarity rare${it.tier}">${grades[it.tier]}</span> <b>${it.name}</b><div class="sub">공격 +${it.power} · 방어 +${it.defense}</div><div class="sub">특수 효과: ${it.effect}</div></div><button class="${s.equip[it.kind]===i?'green':'secondary'}" onclick="equip(${i})">${s.equip[it.kind]===i?'장착 중':'장착'}</button></div>`).join(''):'<div class="card">장비가 없습니다. 대장간에서 첫 장비를 제작하세요.</div>')
else c.innerHTML=`<h2>📖 발견 도감</h2><div class="card"><b class="badge">발견한 조합 ${Object.keys(s.discovered).length}종</b><p class="hint">제작하면 등급·효과 조합이 도감에 등록됩니다. 더 희귀한 장비를 찾아보세요.</p></div>`+(Object.keys(s.discovered).map(x=>`<div class="item">✦ ${x}</div>`).join('')||'<div class="card">아직 발견한 장비가 없습니다.</div>');document.querySelector('#log').innerHTML=history.map(x=>'✦ '+x).join('<br>')}
render();setInterval(()=>{hit();render()},1100);setInterval(()=>{if(Date.now()>=nextEnemyAttack){hurt();nextEnemyAttack=Date.now()+(s.boss?4500:1800)}if(tab==='던전')render()},120);setInterval(save,8000);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
</script></body></html>
