name: Development QA (no deployment)
on:
  push:
    branches: ['develop/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static contracts
        run: python tools/regression_smoke.py
      - name: Install browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Enumerate browser test cases
        run: npx playwright test --list
      - name: Run browser QA
        run: npm run test:browser
      - name: Save failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
