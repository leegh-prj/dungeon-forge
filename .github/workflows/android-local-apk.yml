name: Android APK after full QA (development only)
on:
  workflow_dispatch:
  push:
    branches: ['develop/ui-stabilization']
    paths:
      - 'android/**'
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/android-local-apk.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static regression tests
        run: python3 tools/regression_smoke.py
      - name: Browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser and gameplay P0 tests
        run: npx playwright test --reporter=list
      - name: Upload QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failures
          path: test-results/
          if-no-files-found: ignore
  apk:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Package offline game assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp -R assets android/app/src/main/assets/assets
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/assets/js/save-core.js
      - name: Build test APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK contents and package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/assets/js/save-core.js'
          unzip -l "$APK" | grep -q 'assets/assets/ui/visual-system.css'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.dungeonforge.mobile'"
          sha256sum "$APK" | tee android-apk-sha256.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-forge-landscape-qa-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
