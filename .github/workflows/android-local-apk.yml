name: Android internal QA APK and browser tests
on:
  workflow_dispatch:
  push:
    branches: ['develop/ui-stabilization']
    paths:
      - 'android/**'
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/android-local-apk.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static regression tests
        run: python3 tools/regression_smoke.py
      - name: Browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser and gameplay P0 tests
        run: npx playwright test --reporter=list
      - name: Report QA outcome
        if: always()
        run: |
          echo '## Dungeon Forge browser QA' >> "$GITHUB_STEP_SUMMARY"
          echo 'Static regression and Playwright execution results appear in the steps above.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Failed assertions, if any, are saved as qa-failures artifacts.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failures
          path: test-results/
          if-no-files-found: ignore
  apk:
    # Build in parallel: this is an explicitly UNVERIFIED internal test package.
    # Browser QA remains a separate job and never counts as passed by this build.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Show Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          gradle --version
          command -v sdkmanager
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Mark browser QA status in artifact
        run: |
          echo 'Browser QA: CHECK THE SEPARATE qa JOB IN THIS WORKFLOW RUN' > android-qa-status.txt
          echo 'This APK is for internal testing only, not QA certified.' >> android-qa-status.txt
      - name: Package offline game assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp -R assets android/app/src/main/assets/assets
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/assets/js/save-core.js
      - name: Build test APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../android-gradle-build.log
      - name: Verify APK contents and package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/assets/js/save-core.js'
          unzip -l "$APK" | grep -q 'assets/assets/ui/visual-system.css'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.dungeonforge.mobile'"
          sha256sum "$APK" | tee android-apk-sha256.txt
      - name: Report APK build status
        if: always()
        run: |
          echo '## Dungeon Forge Android APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Browser QA: see independent qa job in this run (runs in parallel).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build details: see Build test APK and Verify APK contents steps.' >> "$GITHUB_STEP_SUMMARY"
          echo 'APK is for internal testing only; a failed QA run is not release-approved.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
            android-qa-status.txt
            android-gradle-build.log
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-forge-landscape-UNVERIFIED-qa-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android-apk-sha256.txt
            android-qa-status.txt
          if-no-files-found: error
          retention-days: 14
