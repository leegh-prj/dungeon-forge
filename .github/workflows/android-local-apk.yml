name: Android internal QA APK and browser tests
on:
  workflow_dispatch:
  push:
    branches: ['develop/ui-stabilization']
    paths:
      - 'android/**'
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/android-local-apk.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static regression tests
        run: python3 tools/regression_smoke.py
      - name: Browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser and gameplay P0 tests
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: qa-results.xml
        run: npx playwright test --reporter=list,junit
      - name: Report QA outcome
        if: always()
        run: |
          echo '## Dungeon Forge browser QA' >> "$GITHUB_STEP_SUMMARY"
          echo 'Static regression and Playwright execution results appear in the steps above.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Failed assertions, if any, are saved as qa-failures artifacts.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload QA test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-evidence
          path: |
            qa-results.xml
            test-results/
          if-no-files-found: ignore
          retention-days: 14
  apk:
    # Build in parallel: this is an explicitly UNVERIFIED internal test package.
    # Browser QA remains a separate job and never counts as passed by this build.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Show Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          gradle --version
          command -v sdkmanager
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Mark browser QA status in artifact
        run: |
          echo 'Browser QA: CHECK THE SEPARATE qa JOB IN THIS WORKFLOW RUN' > android-qa-status.txt
          echo 'This APK is for internal testing only, not QA certified.' >> android-qa-status.txt
      - name: Validate Android offline launch and asset references
        run: python3 tools/android_preflight.py
      - name: Package offline game assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp -R assets android/app/src/main/assets/assets
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/assets/js/save-core.js
          test -s android/app/src/main/assets/assets/js/inventory-core.js
          test -s android/app/src/main/assets/assets/ui/visual-system.css
          grep -q 'appassets.androidplatform.net/assets/index.html' android/app/src/main/java/com/dungeonforge/mobile/MainActivity.java
      - name: Build test APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../android-gradle-build.log
      - name: Verify APK contents and package
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tqq "$APK"
          unzip -l "$APK" > android-apk-contents.txt
          grep -q 'assets/index.html' android-apk-contents.txt
          grep -q 'assets/assets/js/save-core.js' android-apk-contents.txt
          grep -q 'assets/assets/js/inventory-core.js' android-apk-contents.txt
          grep -q 'assets/assets/ui/visual-system.css' android-apk-contents.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > android-apk-badging.txt
          grep -q "package: name='com.dungeonforge.mobile'" android-apk-badging.txt
          grep -q 'launchable-activity: name=.com.dungeonforge.mobile.MainActivity.' android-apk-badging.txt
          grep -q 'sdkVersion:.28.' android-apk-badging.txt
          grep -q 'targetSdkVersion:.35.' android-apk-badging.txt
          sha256sum "$APK" | tee android-apk-sha256.txt
      - name: Report APK build status
        if: always()
        run: |
          echo '## Dungeon Forge Android APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Browser QA: see independent qa job in this run (runs in parallel).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build details: see Build test APK and Verify APK contents steps.' >> "$GITHUB_STEP_SUMMARY"
          echo 'APK is for internal testing only; a failed QA run is not release-approved.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
            android-qa-status.txt
            android-gradle-build.log
            android-apk-contents.txt
            android-apk-badging.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload installable debug APK
        id: apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-forge-landscape-UNVERIFIED-qa-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android-apk-sha256.txt
            android-qa-status.txt
            android-apk-contents.txt
            android-apk-badging.txt
          if-no-files-found: error
          retention-days: 14
      - name: Add APK download link to build summary
        if: success()
        run: |
          echo '### Internal APK ready for download' >> "$GITHUB_STEP_SUMMARY"
          echo '[Open APK artifact](${{ steps.apk_artifact.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract app-debug.apk from the ZIP; debug build only, QA may still have failed.' >> "$GITHUB_STEP_SUMMARY"
