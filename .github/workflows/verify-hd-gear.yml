name: Verify HD gear assets
on:
  push:
    paths:
      - 'assets/gear/**'
      - 'tools/verify_gear_assets.py'
      - '.github/workflows/verify-hd-gear.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/verify_gear_assets.py
