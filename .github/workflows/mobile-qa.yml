name: Dungeon Forge Mobile E2E QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'qa/mobile-e2e.cjs'
      - '.github/workflows/mobile-qa.yml'
jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node qa/mobile-e2e.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-screenshots
          path: qa-artifacts/
          if-no-files-found: warn
